[package]
name = "gh-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive"] }
console = "0.16.3"
directories = "6.0.0"
futures = "0.3.32"
indicatif = "0.18.4"
is-terminal = "0.4.17"
keyring = "4.0.1"
oauth2 = { version = "4.4.2", features = ["reqwest"] }
open = "5.3.5"
owo-colors = "4.3.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
serde_yaml = "0.9.34"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["trace", "auth", "cors"] }
url = "2.5.8"
ratatui = { version = "0.30.0", features = ["crossterm"] }
crossterm = "0.29.0"
inquire = "0.9.4"
tabled = { version = "0.20.0", features = ["std", "derive"] }

[dev-dependencies]
mockall = "0.14.0"
tempfile = "3.27.0"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce parallel code generation for better optimization
panic = "abort"     # Remove stack unwinding for smaller binaries
strip = true        # Automatically strip symbols from the binary
